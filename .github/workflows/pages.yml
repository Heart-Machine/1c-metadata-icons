# Сайт на GitHub Pages: https://heart-machine.github.io/1c-metadata-icons/
# Собирает иконки и сайт (npm run site) и публикует dist/site. Файлы .cf и .cfe сайт берёт из последнего релиза.
name: Сайт

on:
  push:
    branches: [main]
    paths:
      - src/**
      - icons.json
      - scripts/**
      - package.json
      - package-lock.json
      - LICENSE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
